function addScript(){const id=unique("S_NEW",project.scripts);project.scripts.push({id,title:"新脚本",mode:"once",output:"main",condition:"",onStart:[],onComplete:[],dialogues:[],buttons:[]});selectedScript=id;render()}
function deleteScript(id){project.scripts=project.scripts.filter(x=>x.id!==id);project.events.forEach(e=>e.actions=e.actions.filter(a=>a.target!==id&&a.returnTo!==id));selectedScript=project.scripts[0]?.id||"";render()}
function deleteEvent(id){project.events=project.events.filter(x=>x.id!==id);project.scripts.forEach(s=>{s.onStart=s.onStart.filter(x=>x!==id);s.onComplete=s.onComplete.filter(x=>x!==id);s.dialogues.forEach(d=>{if(d.emit===id)d.emit=""});s.buttons.forEach(b=>{if(b.event===id)b.event=""})});project.events.forEach(e=>e.actions=e.actions.filter(a=>!(a.type==="emit"&&a.target===id)));project.conditions.forEach(c=>c.rules=c.rules.filter(r=>r.event!==id));selectedEvent=project.events[0]?.id||"";render()}
function renameEvent(oldId,newId){newId=newId.trim();if(!newId||project.events.some(x=>x.id===newId&&x.id!==oldId))return render();getE(oldId).id=newId;project.scripts.forEach(s=>{s.onStart=s.onStart.map(x=>x===oldId?newId:x);s.onComplete=s.onComplete.map(x=>x===oldId?newId:x);s.dialogues.forEach(d=>{if(d.emit===oldId)d.emit=newId});s.buttons.forEach(b=>{if(b.event===oldId)b.event=newId})});project.events.forEach(e=>e.actions.forEach(a=>{if(a.type==="emit"&&a.target===oldId)a.target=newId}));project.conditions.forEach(c=>c.rules.forEach(r=>{if(r.event===oldId)r.event=newId}));selectedEvent=newId;render()}

function pass(id){if(!id)return true;const c=getC(id);if(!c)return false;const checks=c.rules.map(r=>{const n=runtime.history[r.event]||0,v=Number(r.value)||0;return r.op==="="?n===v:r.op===">="?n>=v:r.op==="<="?n<=v:r.op===">"?n>v:n<v});return c.mode==="any"?checks.some(Boolean):checks.every(Boolean)}
function log(text,id=""){runtime.log.push({text,id});ledger()}
function emit(id,depth=0){if(!id||depth>32)return false;const e=getE(id);if(!e)return false;runtime.history[id]=(runtime.history[id]||0)+1;log(e.name,id);if(!pass(e.condition))return false;let moved=false;e.actions.forEach(a=>{if(!pass(a.condition))return;if(a.type==="emit")moved=emit(a.target,depth+1)||moved;else if(a.type==="call"){runtime.stack.push(a.returnTo||runtime.current);activate(a.target);moved=true}else if(a.type==="return"){const target=a.target||runtime.stack.pop();if(target){resume(target);moved=true}}else if(a.type==="activate"){activate(a.target);moved=true}});return moved}
async function activate(id){const s=getS(id);if(!s||!pass(s.condition))return;if(s.mode==="once"&&runtime.once.has(id)){log("一次性脚本已完成",id);return}const token=++runtime.token;runtime.current=id;if(s.mode==="once")runtime.once.add(id);$("#runtimeTitle").textContent=s.id+" · "+s.title;$("#runtimeScreen").innerHTML="";$("#runtimeButtons").innerHTML="";s.onStart.forEach(emit);if(token!==runtime.token)return;for(const d of s.dialogues){if(!pass(d.condition))continue;if(d.emit&&d.emitWhen==="start")emit(d.emit);if(token!==runtime.token)return;await showLine(d,token);if(d.emit&&d.emitWhen!=="start")emit(d.emit);if(token!==runtime.token)return}s.onComplete.forEach(emit);if(token!==runtime.token)return;runButtons(s)}
function showLine(d,token){return new Promise(done=>{const line=document.createElement("div");line.className="runtime-line "+(d.effect||"");line.style.color=d.color||"var(--text)";$("#runtimeScreen").appendChild(line);const text=d.text||"",duration=Math.max(0,Number(d.reveal)||0);if(!duration||!text){line.textContent=text;done();return}const start=performance.now();function tick(now){if(token!==runtime.token){done();return}const p=Math.min(1,(now-start)/duration);line.textContent=text.slice(0,Math.ceil(text.length*p));$("#runtimeScreen").scrollTop=$("#runtimeScreen").scrollHeight;if(p<1)requestAnimationFrame(tick);else done()}requestAnimationFrame(tick)})}
function resume(id){const s=getS(id);if(!s)return;runtime.token++;runtime.current=id;$("#runtimeTitle").textContent=s.id+" · "+s.title;$("#runtimeScreen").innerHTML="";s.dialogues.filter(d=>pass(d.condition)).forEach(d=>{const line=document.createElement("div");line.className="runtime-line";line.style.color=d.color||"var(--text)";line.textContent=d.text||"";$("#runtimeScreen").appendChild(line)});runButtons(s)}
function runButtons(s){const root=$("#runtimeButtons");root.innerHTML="";s.buttons.filter(b=>pass(b.condition)).forEach(b=>{const el=document.createElement("button");el.className="runtime-button";el.textContent=b.label;el.onclick=()=>{root.innerHTML="";const before=runtime.current,moved=emit(b.event);if(!moved&&runtime.current===before)runButtons(s)};root.appendChild(el)})}

$("#addScriptBtn").onclick=addScript;$("#runBtn").onclick=()=>startRun();$("#stopBtn").onclick=stopRun;$("#resetBtn").onclick=()=>{project=clone(sample);selectedScript=project.scripts[0].id;selectedEvent=project.events[0].id;selectedCondition=project.conditions[0].id;runtime={token:runtime.token+1,current:"",history:{},stack:[],once:new Set(),log:[]};render();stopRun()};
