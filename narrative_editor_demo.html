<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><strong>交互式脚本编排器</strong><span>脚本 / 对话 / 按钮 / 事件 / 条件 / 标签</span></div>
    <div class="actions"><button id="runBtn" class="btn primary">从头运行</button><button id="resetBtn" class="btn">恢复 SET 1</button><button id="importBtn" class="btn">导入</button><button id="exportBtn" class="btn">导出游玩 HTML</button><input id="importFile" class="hidden" type="file" accept=".json,application/json"></div>
  </header>
  <section class="workspace">
    <section class="pane"><div class="pane-head"><h2>主脚本时间线</h2><button id="addScriptBtn" class="btn">+ 脚本</button></div><div id="timeline" class="pane-body timeline scroll"></div></section>
    <section class="pane"><div class="pane-head"><h2>当前脚本</h2><span class="hint">对话、动效与触发</span></div><div id="scriptEditor" class="pane-body scroll"></div></section>
    <section class="pane relations"><div class="tabs"><button class="tab active" data-tab="graph">脚本流程图</button><button class="tab" data-tab="events">事件库</button><button class="tab" data-tab="conditions">条件库</button><button class="tab" data-tab="tags">标签库</button></div><div id="relationEditor" class="pane-body graph-panel"></div></section>

function pass(id){if(!id)return true;const c=getC(id);if(!c)return false;const checks=c.rules.map(r=>{const n=boundedCount(runtime.history[r.event]),v=boundedCount(r.value);if(r.op==="=")return n===v;if(r.op===">=")return n>=v;if(r.op==="<=")return n<=v;if(r.op===">")return n>v;if(r.op==="<")return n<v;return false});return c.mode==="any"?checks.some(Boolean):checks.every(Boolean)}

function openRuntimeDrawer(s){const drawer=$("#runtimeDrawer"),screen=$("#drawerScreen"),key=panelSessionKey(s),same=runtime.panelKey===key&&!drawer.classList.contains("hidden");if(runtime.panelKey&&runtime.panelKey!==key)stashPanelView();drawer.classList.remove("hidden");$(".runner")?.classList.add("drawer-open");drawer.dataset.kind=s.panelKind||"generic";$("#drawerTitle").textContent=s.id+" · "+s.title;if(!same){const saved=runtime.panelViews.get(key);screen.innerHTML=saved?.html||"";$("#drawerButtons").innerHTML="";screen.scrollTop=drawer.dataset.kind==="manual"?0:(saved?.scrollTop??screen.scrollHeight)}runtime.panelKey=key}

async function emit(id,depth=0,trail=new Set()){if(!id||depth>32)return false;if(trail.has(id)){log("检测到循环事件，已中止",id);return false}const e=getE(id);if(!e||!pass(e.condition))return false;const nextTrail=new Set(trail);nextTrail.add(id);runtime.history[id]=Math.min(MAX_COUNT,boundedCount(runtime.history[id])+1);log(e.name,id);refreshButtonLifecycle(id);destroyDialoguesForEvent(id);let moved=false;for(const a of e.actions){if(!pass(a.condition))continue;if(a.type==="emit")moved=await emit(a.target,depth+1,nextTrail)||moved;else if(a.type==="dialogue")moved=await showEventDialogue(a.target)||moved;else if(a.type==="destroyDialogue"){destroyDialogue(a.target);moved=true}else if(a.type==="call"||a.type==="panel"){runtime.stack.push(a.returnTo||runtime.current);await activate(a.target);moved=true}else if(a.type==="return"){const target=a.target||runtime.stack.pop();if(target){resume(target);moved=true}}else if(a.type==="activate"){await activate(a.target);moved=true}}if(!moved){const panel=project.scripts.find(s=>s.output==="panel"&&s.panelEvent===id&&pass(s.condition)&&pass(s.panelCondition)&&s.id!==runtime.current&&!runtime.panelLaunching.has(s.id));if(panel){runtime.panelLaunching.add(panel.id);runtime.stack.push(runtime.current);await activate(panel.id);runtime.panelLaunching.delete(panel.id);moved=true}}return moved}
async function showEventDialogue(key){const ref=getDialogueRef(key);if(!ref||!pass(ref.item.condition))return false;const d=ref.item,token=runtime.token;if(ref.script.output==="panel")openRuntimeDrawer(ref.script);if(d.emit&&d.emitWhen==="start")await emit(d.emit);if(token!==runtime.token)return true;await showLine(d,token,dialogueHost(ref.script),key);if(token===runtime.token&&d.emit&&d.emitWhen!=="start")await emit(d.emit);return true}
function waitBeforeDialogue(delay){const ms=boundedMs(delay);return ms?new Promise(done=>setTimeout(done,ms)):Promise.resolve()}
async function activate(id){const s=getS(id);if(!s||!pass(s.condition)||(s.output==="panel"&&!pass(s.panelCondition)))return;if(s.mode==="once"&&runtime.once.has(id)){log("一次性脚本已完成",id);return}const token=++runtime.token,revisiting=s.output==="panel"&&runtime.panelSeen.has(s.id);clearRuntimeButtons();runtime.current=id;if(s.mode==="once")runtime.once.add(id);if(s.output==="panel")openRuntimeDrawer(s);else{$("#runtimeTitle").textContent=s.id+" · "+s.title;closeRuntimeDrawer()}if(revisiting){s.items.filter(item=>item.type==="button").forEach(item=>prepareButton(item,token));return}if(s.output==="panel")runtime.panelSeen.add(s.id);for(const eventId of s.onStart)await emit(eventId);if(token!==runtime.token)return;for(const item of s.items){if(item.type==="dialogue"){if(item.appear==="event"||!pass(item.condition))continue;await waitBeforeDialogue(item.delay);if(token!==runtime.token)return;if(item.emit&&item.emitWhen==="start")await emit(item.emit);if(token!==runtime.token)return;await showLine(item,token,dialogueHost(s),dialogueKey(s.id,item.id));if(item.emit&&item.emitWhen!=="start")await emit(item.emit);if(token!==runtime.token)return}else{const wait=prepareButton(item,token);if(item.blocking)await wait;if(token!==runtime.token)return}}for(const eventId of s.onComplete)await emit(eventId)}
function scrollRuntimeHost(host){const manual=host===$("#drawerScreen")&&$("#runtimeDrawer").dataset.kind==="manual";host.scrollTop=manual?0:host.scrollHeight}
function removeDialogueFromHtml(html,key){const template=document.createElement("template");template.innerHTML=html;template.content.querySelectorAll(`[data-dialogue="${CSS.escape(key)}"]`).forEach(el=>el.remove());return template.innerHTML}
function destroyDialogue(key){if(!key)return false;const timers=runtime.dialogueTimers.get(key);if(timers){timers.forEach(clearTimeout);runtime.dialogueTimers.delete(key)}let removed=false;document.querySelectorAll(`.runtime-line[data-dialogue="${CSS.escape(key)}"]`).forEach(el=>{el.remove();removed=true});runtime.panelViews.forEach((view,panelKey)=>{const html=removeDialogueFromHtml(view.html,key);if(html!==view.html){runtime.panelViews.set(panelKey,{...view,html});removed=true}});return removed}

function showLine(d,token,host=$("#runtimeScreen"),key=""){return new Promise(done=>{const tag=getT(d.tag),effect=tag?.effect||d.effect||"none",output=tag?.output||"plain",line=document.createElement("div");line.className="runtime-line output-"+output+" "+effect;line.dataset.tag=tag?.name||d.speaker||"";line.dataset.dialogue=key;line.style.color=tag?.color||d.color||"var(--text)";host.appendChild(line);const text=d.text||"",duration=boundedMs(d.reveal);if(!duration||!text){line.textContent=text;scrollRuntimeHost(host);if(token===runtime.token)armDialogueLifetime(d,key);done();return}const start=performance.now();let settled=false;const finish=()=>{if(settled)return;settled=true;clearTimeout(deadline);if(token===runtime.token){line.textContent=text;armDialogueLifetime(d,key)}scrollRuntimeHost(host);done()},deadline=setTimeout(finish,duration);function tick(now){if(settled)return;if(token!==runtime.token){finish();return}const p=Math.min(1,(now-start)/duration);line.textContent=text.slice(0,Math.ceil(text.length*p));scrollRuntimeHost(host);if(p<1)requestAnimationFrame(tick);else finish()}requestAnimationFrame(tick)})}
function resolveButtonWait(r){if(!r.settled){r.settled=true;r.resolve()}}

function buttonEligible(r,eventId=""){const b=r.b;if(b.appear==="event")return !!b.showEvent&&(eventId===b.showEvent||(runtime.history[b.showEvent]||0)>0);if(b.appear==="condition")return pass(b.condition);return pass(b.condition)}

function scheduleButton(r){if(r.shown)return;r.shown=true;runtime.pendingButtons=runtime.pendingButtons.filter(x=>x!==r);const show=()=>{if(r.token!==runtime.token)return finishButton(r);const b=r.b,el=document.createElement("button");r.el=el;el.className="runtime-button";el.textContent=b.label||"未命名按钮";runtime.liveButtons.set(b.id,r);buttonHost().appendChild(el);el.onclick=async()=>{if(!b.repeat)el.disabled=true;resolveButtonWait(r);if(b.lifetime==="click")finishButton(r);await emit(b.event)};if(b.lifetime==="fixed")r.timer=setTimeout(()=>finishButton(r),boundedMs(b.duration));if(b.lifetime==="condition"&&!pass(b.keepCondition||b.condition))finishButton(r)};r.timer=setTimeout(show,boundedMs(r.b.delay))}

function startRun(id=project.scripts[0]?.id){const token=runtime.token+1;clearRuntimeButtons();clearDialogueTimers();closeRuntimeDrawer(true);runtime=freshRuntime(token);$("#runtimeScreen").innerHTML="";$("#runtimeButtons").innerHTML="";ledger();if(id)activate(id)}

function playableHtml(){const root=document.documentElement.cloneNode(true),title=root.querySelector("title"),drawer=root.querySelector("#runtimeDrawer"),runner=root.querySelector(".runner");root.querySelector("body").classList.add("play-mode");if(title)title.textContent=project.scripts[0]?.title||"互动故事";["timeline","scriptEditor","relationEditor","runtimeScreen","runtimeButtons","drawerScreen","drawerButtons","eventLedger"].forEach(id=>{const el=root.querySelector("#"+id);if(el)el.innerHTML=""});if(drawer)drawer.classList.add("hidden");if(runner)runner.classList.remove("drawer-open");const mainScript=root.querySelector("script"),bootstrap=document.createElement("script"),data=JSON.stringify(clone(project)).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");bootstrap.textContent="window.__PLAYABLE_PROJECT__="+data+";";mainScript.parentNode.insertBefore(bootstrap,mainScript);return "<!doctype html>\n"+root.outerHTML}
