function destroyDialogue(key){if(!key)return false;const timers=runtime.dialogueTimers.get(key);if(timers){timers.forEach(clearTimeout);runtime.dialogueTimers.delete(key)}let removed=false;document.querySelectorAll(`.runtime-line[data-dialogue="${CSS.escape(key)}"]`).forEach(el=>{el.remove();removed=true});runtime.panelViews.forEach((view,panelKey)=>{const lines=(view.lines||[]).filter(line=>line.dialogue!==key);if(lines.length!==(view.lines||[]).length){runtime.panelViews.set(panelKey,{...view,lines});removed=true}});return removed}
function destroyDialoguesForEvent(eventId){project.scripts.forEach(s=>s.items.forEach(item=>{if(item.type==="dialogue"&&item.lifetime==="event"&&item.destroyEvent===eventId)destroyDialogue(dialogueKey(s.id,item.id))}))}
function armDialogueLifetime(d,key){if(d.lifetime!=="fixed"||!key)return;const timers=runtime.dialogueTimers.get(key)||new Set(),timer=setTimeout(()=>destroyDialogue(key),boundedMs(d.duration));timers.add(timer);runtime.dialogueTimers.set(key,timers)}
function clearDialogueTimers(){runtime.dialogueTimers.forEach(timers=>timers.forEach(clearTimeout));runtime.dialogueTimers.clear()}
function textSegments(text){if(typeof Intl!=="undefined"&&Intl.Segmenter)return[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(text)].map(x=>x.segment);return Array.from(text)}
function showLine(d,token,host=$("#runtimeScreen"),key=""){return new Promise(done=>{const tag=getT(d.tag),effect=tag?.effect||"none",output=tag?.output||"plain",line=document.createElement("div");line.className="runtime-line output-"+output+" "+effect;line.dataset.tag=tag?.name||"";line.dataset.tagId=d.tag||"";line.dataset.dialogue=key;line.style.color=tag?.color||"var(--text)";host.appendChild(line);const text=limitedString(d.text,MAX_TEXT),segments=textSegments(text),duration=Math.min(MAX_REVEAL_MS,boundedMs(d.reveal));if(!duration||!text){line.textContent=text;scrollRuntimeHost(host);if(token===runtime.token)armDialogueLifetime(d,key);done();return}const start=performance.now();let settled=false,shown=0,timer=0;const finish=()=>{if(settled)return;settled=true;clearTimeout(timer);if(token===runtime.token){line.textContent=text;armDialogueLifetime(d,key)}scrollRuntimeHost(host);done()};function tick(){if(settled)return;if(token!==runtime.token){finish();return}const now=performance.now(),next=Math.min(segments.length,Math.ceil(segments.length*Math.min(1,(now-start)/duration)));if(next>shown){line.append(segments.slice(shown,next).join(""));shown=next;scrollRuntimeHost(host)}if(shown>=segments.length)return finish();const nextAt=start+(shown+1)*duration/segments.length;timer=setTimeout(tick,Math.max(8,Math.min(250,nextAt-performance.now())))}tick()})}
function resolveButtonWait(r){if(!r.settled){r.settled=true;r.resolve()}}
function finishButton(r){clearTimeout(r.timer);r.el?.remove();runtime.liveButtons.delete(r.b.id);runtime.pendingButtons=runtime.pendingButtons.filter(x=>x!==r);resolveButtonWait(r)}
function clearRuntimeButtons(){[...runtime.liveButtons.values(),...runtime.pendingButtons].forEach(finishButton);runtime.liveButtons.clear();runtime.pendingButtons=[];$("#runtimeButtons").innerHTML="";$("#drawerButtons").innerHTML=""}
function buttonEligible(r,eventId=""){const b=r.b;if(runtime.dismissedButtons.has(b.id))return false;if(b.appear==="event")return !!b.showEvent&&(eventId===b.showEvent||(runtime.history[b.showEvent]||0)>0);if(b.appear==="condition")return pass(b.condition);return pass(b.condition)}
function prepareButton(b,token){return new Promise(resolve=>{const r={b,token,resolve,settled:false,shown:false,el:null,timer:null};if(buttonEligible(r))scheduleButton(r);else if(b.appear==="event"||b.appear==="condition")runtime.pendingButtons.push(r);else resolveButtonWait(r)})}
function scheduleButton(r){if(r.shown)return;r.shown=true;runtime.pendingButtons=runtime.pendingButtons.filter(x=>x!==r);const show=()=>{if(r.token!==runtime.token||runtime.dismissedButtons.has(r.b.id))return finishButton(r);const b=r.b,el=document.createElement("button");r.el=el;el.className="runtime-button";el.textContent=b.label||"未命名按钮";runtime.liveButtons.set(b.id,r);buttonHost().appendChild(el);el.onclick=async()=>{if(!b.repeat){el.disabled=true;if(getS(runtime.current)?.output==="main")runtime.consumedButtons.add(b.id)}resolveButtonWait(r);if(b.lifetime==="click"&&!b.repeat)finishButton(r);await emit(b.event)};if(b.lifetime==="fixed"){const deadline=runtime.buttonDeadlines.get(b.id)||Date.now()+boundedMs(b.duration),remaining=deadline-Date.now();runtime.buttonDeadlines.set(b.id,deadline);if(remaining<=0){runtime.dismissedButtons.add(b.id);runtime.buttonDeadlines.delete(b.id);finishButton(r)}else r.timer=setTimeout(()=>{runtime.dismissedButtons.add(b.id);runtime.buttonDeadlines.delete(b.id);finishButton(r)},remaining)}if(b.lifetime==="condition"&&!pass(b.keepCondition||b.condition))finishButton(r)};r.timer=setTimeout(show,boundedMs(r.b.delay))}
function refreshButtonLifecycle(eventId){if(eventId)project.scripts.forEach(s=>s.items.forEach(item=>{if(item.type==="button"&&item.lifetime==="event"&&item.hideEvent===eventId){runtime.dismissedButtons.add(item.id);runtime.buttonDeadlines.delete(item.id)}}));runtime.pendingButtons.slice().forEach(r=>{if(runtime.dismissedButtons.has(r.b.id))finishButton(r);else if(buttonEligible(r,eventId))scheduleButton(r)});runtime.liveButtons.forEach(r=>{const b=r.b;if(runtime.dismissedButtons.has(b.id))finishButton(r);else if(b.lifetime==="condition"&&!pass(b.keepCondition||b.condition))finishButton(r)})}
function resume(id){const s=getS(id);if(!s)return false;const progress=runtime.scriptProgress.get(id)||0;if(s.output==="main"&&!runtime.completed.has(id)&&progress<s.items.length){runtime.running.delete(id);void activate(id,"",true);return true}const token=++runtime.token;clearRuntimeButtons();runtime.current=id;if(s.output==="panel")openRuntimeDrawer(s);else{$("#runtimeTitle").textContent=s.id+" · "+s.title;closeRuntimeDrawer()}s.items.filter(item=>item.type==="button"&&(s.output==="panel"||!runtime.consumedButtons.has(item.id))).forEach(item=>prepareButton(item,token));return true}
function startRun(id=project.scripts[0]?.id,ignoreEntryCondition=false){const errors=blockingProjectErrors();if(errors.length){if(!PLAYABLE){activeTab="issues";relations()}alert(`项目存在 ${errors.length} 个错误，请先在“问题”页修复后再运行。`);return Promise.resolve(false)}const token=runtime.token+1;clearRuntimeButtons();clearDialogueTimers();closeRuntimeDrawer(true);runtime=freshRuntime(token);$("#runtimeScreen").innerHTML="";$("#runtimeButtons").innerHTML="";ledger();if(!id)return Promise.resolve(false);const script=getS(id);if(ignoreEntryCondition&&script?.condition&&!pass(script.condition))log("调试运行：已忽略当前脚本进入条件",script.condition);return activate(id,"",false,ignoreEntryCondition)}
function stopRun(){runtime.token++;clearRuntimeButtons();clearDialogueTimers();runtime.current="";runtime.panelViews.clear();runtime.panelStarted.clear();runtime.panelCompleted.clear();runtime.panelProgress.clear();runtime.scriptProgress.clear();runtime.consumedButtons.clear();runtime.dismissedButtons.clear();runtime.buttonDeadlines.clear();runtime.running.clear();$("#runtimeScreen").innerHTML="";closeRuntimeDrawer(true);$("#runtimeTitle").textContent="已停止"}
function ledger(){const root=$("#eventLedger");if(!root)return;const entries=Object.entries(runtime.history),variables=project.variables.map(v=>`<div class="counter variable"><span>${esc(v.id)}</span><span>${esc(boundedVariable(runtime.variables[v.id],v.initial))}</span></div>`).join("");root.innerHTML=(variables?'<div class="ledger-section">变量</div>'+variables:"")+'<div class="ledger-section">事件</div>'+(entries.length?entries.map(([id,n])=>`<div class="counter"><span>${esc(id)}</span><span>${n}</span></div>`).join(""):'<div class="empty">尚未产生事件。</div>')+runtime.log.slice(-12).reverse().map(x=>`<div class="log"><strong>${esc(x.id)}</strong> ${esc(x.text)}</div>`).join("")}
function playableHtml(){const root=document.documentElement.cloneNode(true),title=root.querySelector("title"),drawer=root.querySelector("#runtimeDrawer"),runner=root.querySelector(".runner"),exported=clone(project);delete exported.ui;root.querySelector("body").classList.add("play-mode");if(title)title.textContent=project.scripts[0]?.title||"互动故事";root.querySelectorAll(".topbar,.workspace,.ledger").forEach(el=>el.remove());["runtimeScreen","runtimeButtons","drawerScreen","drawerButtons"].forEach(id=>{const el=root.querySelector("#"+id);if(el)el.innerHTML=""});if(drawer)drawer.classList.add("hidden");if(runner)runner.classList.remove("drawer-open");const mainScript=root.querySelector("script"),bootstrap=document.createElement("script"),data=JSON.stringify(exported).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");bootstrap.textContent="window.__PLAYABLE_PROJECT__="+data+";";mainScript.parentNode.insertBefore(bootstrap,mainScript);return "<!doctype html>\n"+root.outerHTML}
function exportPlayable(){const errors=blockingProjectErrors();if(errors.length){activeTab="issues";relations();alert(`项目存在 ${errors.length} 个错误，请先修复后再导出。`);return false}const blob=new Blob([playableHtml()],{type:"text/html;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a"),base=(project.scripts[0]?.title||"interactive-story").replace(/[\\/:*?\"<>|]/g,"-");link.href=url;link.download=base+"-游玩版.html";link.click();setTimeout(()=>URL.revokeObjectURL(url),0);return true}
function assertProjectShape(value){if(!value||typeof value!=="object")throw new Error("项目根节点无效");for(const key of ["scripts","events","conditions","variables","tags"])if(Array.isArray(value[key])&&value[key].length>MAX_ENTITIES)throw new Error(`${key} 数量超过 ${MAX_ENTITIES}`);for(const script of Array.isArray(value.scripts)?value.scripts:[]){const count=Array.isArray(script.items)?script.items.length:(Array.isArray(script.dialogues)?script.dialogues.length:0)+(Array.isArray(script.buttons)?script.buttons.length:0);if(count>MAX_ITEMS)throw new Error(`脚本 ${limitedString(script.id,MAX_ID,"未命名")} 的内容超过 ${MAX_ITEMS} 项`)}for(const event of Array.isArray(value.events)?value.events:[])if(Array.isArray(event.actions)&&event.actions.length>MAX_ITEMS)throw new Error(`事件动作超过 ${MAX_ITEMS} 项`);for(const condition of Array.isArray(value.conditions)?value.conditions:[])if(Array.isArray(condition.rules)&&condition.rules.length>MAX_ITEMS)throw new Error(`条件规则超过 ${MAX_ITEMS} 项`);return true}

$("#drawerClose").onclick=()=>{const target=runtime.stack.pop();if(target&&resume(target))return;runtime.token++;clearRuntimeButtons();runtime.current="";closeRuntimeDrawer()};
if(!PLAYABLE){bind("[data-workspace-view]","click",event=>{const view=event.currentTarget.dataset.workspaceView;setWorkspaceView(view);if(view==="graph")graphTab()},$("#workspace"));window.addEventListener("beforeunload",save);$("#addScriptBtn").onclick=addScript;$("#runBtn").onclick=()=>startRun();$("#stopBtn").onclick=stopRun;$("#resetBtn").onclick=()=>{project=normalize(clone(sample));expandedItems.clear();selectedScript=project.scripts[0].id;selectedEvent=project.events[0].id;selectedCondition=project.conditions[0].id;selectedVariable=project.variables[0]?.id||"";selectedTag=project.tags[0]?.id||"";activeTab="script";graphScope="all";graphAutoFit=true;runtime=freshRuntime(runtime.token+1);render();stopRun()};$("#exportBtn").onclick=exportPlayable;$("#importBtn").onclick=()=>$("#importFile").click();$("#importFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>MAX_IMPORT_BYTES)throw new Error(`文件超过 ${MAX_IMPORT_BYTES/1024/1024} MB`);const imported=JSON.parse(await file.text());assertProjectShape(imported);project=normalize(imported);expandedItems.clear();selectedScript=project.scripts[0]?.id||"";selectedEvent=project.events[0]?.id||"";selectedCondition=project.conditions[0]?.id||"";selectedVariable=project.variables[0]?.id||"";selectedTag=project.tags[0]?.id||"";activeTab="script";graphScope="all";const state=graphViewState();graphZoom=clampZoom(state.zoom);graphAutoFit=!state.saved;runtime=freshRuntime(runtime.token+1);render();ledger()}catch(error){alert("无法导入项目："+(error?.message||"JSON 文件无效"))}e.target.value=""}}
